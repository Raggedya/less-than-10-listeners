<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gig Roulette</title><style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond&family=Outfit:wght@400;600;700&display=swap');
*{box-sizing:border-box}body{background:radial-gradient(ellipse at 50% 25%,#30220e,#050508 60%);color:#f4e8d2;font-family:Outfit,sans-serif;margin:0}main{max-width:560px;padding:22px 15px 35px;margin:auto;text-align:center;overflow:hidden}h1{font-size:clamp(40px,11vw,68px);line-height:.95;margin:0;color:#fff}h1 span{display:block;color:#dbad60;letter-spacing:.18em;font-size:.7em}header p{font-size:10px;letter-spacing:.24em;color:#bcb0a0}form{display:flex;gap:8px;background:#0b0c15;border:1px solid #9e7b48;border-radius:14px;padding:8px;margin:24px 0 8px}input{background:transparent;border:0;color:white;flex:1;min-width:0;padding:10px;font-size:16px}button,.link{cursor:pointer;color:white;background:#071a3e;border:1px solid #319aff;border-radius:10px;padding:12px}#hint{font-size:11px;color:#c5b69a;min-height:28px}#reel{height:min(86vw,460px);min-height:270px;position:relative;perspective:950px;touch-action:pan-y;outline:0}.tile{position:absolute;top:5px;left:50%;width:min(78vw,390px);aspect-ratio:1;transform-style:preserve-3d;pointer-events:none}.art{height:100%;width:100%;border:2px solid #cda65e;border-radius:12px;box-shadow:0 0 24px #d6ad6140,inset 0 0 22px #d8a24b30;overflow:hidden;background:radial-gradient(circle at 50% 65%,var(--dark),#05050b 75%)}.art svg{width:100%;height:100%;filter:drop-shadow(0 0 14px var(--bright))}.art p{position:absolute;bottom:12px;left:0;right:0;font-size:10px;letter-spacing:.2em;color:#eac98d;text-transform:uppercase}.nav{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px}.nav button{border-color:#957344;border-radius:50%;background:#11101b}.nav span{font-size:10px;color:#baa77f;letter-spacing:.1em}h2{font:48px Cormorant Garamond,serif;margin:6px 0}.type{color:#e6b65c;text-transform:uppercase;letter-spacing:.15em;font-size:12px}.address{color:#c5b9a9;font-size:12px;margin:10px}.link{display:block;text-decoration:none;border-radius:30px;margin:16px 0 0;padding:17px;letter-spacing:.18em}.directions{color:#d6b472;font-size:12px;display:block;margin:15px}.note{font-size:10px;line-height:1.6;color:#a49a8b;margin-top:22px}@media(prefers-reduced-motion:reduce){.tile{transition:none}}
</style><main><header><h1>GIG <span>ROULETTE</span></h1><p>FIND YOUR NEXT NIGHT OF LIVE MUSIC</p></header><form id="form"><input id="place" value="Brunswick" placeholder="Where are you?" aria-label="Where are you?" required><button>SEARCH</button></form><div id="hint" role="status"></div><div id="reel" tabindex="0" aria-label="Swipe or use arrow keys to explore venues"></div><div class="nav"><button id="prev" aria-label="Previous venue">❮</button><span>FLICK TO SPIN · <button id="sound" style="padding:4px;border:0;background:none;color:#eac98d">SOUND ON</button></span><button id="next" aria-label="Next venue">❯</button></div><h2 id="name"></h2><div class="type" id="type"></div><div class="address" id="address"></div><a class="link" id="gigs" target="_blank" rel="noopener noreferrer">WHAT'S ON ↗</a><a class="directions" id="map" target="_blank" rel="noopener noreferrer">DIRECTIONS ↗</a><div class="note">Prototype · Curated inner-Melbourne music venues. Venue owners maintain their own gig listings. Check the linked page for current performances.</div></main>
<script>
const all=[["Retreat Hotel","Brunswick","280 Sydney Rd","Indie / rock","https://retreathotelbrunswick.com.au/gigs/","rock"],["Brunswick Ballroom","Brunswick","314 Sydney Rd","Eclectic","https://brunswickballroom.com.au/whats-on/","soul"],["The Bergy","Brunswick","64 Sydney Rd","Rock","https://thebergy.com.au/","rock"],["Howler","Brunswick","7 Dawson St","Electronic / indie","https://www.howlerbrunswick.com/","electronic"],["The JazzLab","Brunswick","27 Leslie St","Jazz","https://thejazzlab.com.au/","jazz"],["Bar Oussou","Brunswick","653 Sydney Rd","World music","https://www.baroussou.com.au/","world"],["The Penny Black","Brunswick","420 Sydney Rd","Live bands","https://www.thepennyblack.com.au/","rock"],["Tempo Rubato","Brunswick","34 Breese St","Classical","https://temporubato.com.au/","classical"],["Northcote Social Club","Northcote","301 High St","Indie","https://www.northcotesocialclub.com/","rock"],["Wesley Anne","Northcote","250 High St","Folk / acoustic","https://wesleyanne.com.au/","world"],["Northcote Theatre","Northcote","216 High St","Touring","https://www.northcotetheatre.com/","soul"],["The Night Cat","Fitzroy","137 Johnston St","Soul / funk","https://www.thenightcat.com.au/","soul"],["The Old Bar","Fitzroy","74 Johnston St","Indie / punk","https://www.theoldbar.com.au/","rock"],["The Workers Club","Fitzroy","51 Brunswick St","Indie","https://theworkersclub.com.au/","rock"],["The Tote","Collingwood","67 Johnston St","Punk / rock","https://thetotehotel.com/","rock"]],colors={rock:['#ff4d62','#ffb04d','#4b142a'],electronic:['#00d6ff','#a05aff','#182958'],jazz:['#ffcc62','#d45a8e','#42231a'],soul:['#d6a1ff','#ffa447','#35214d'],world:['#29f0b4','#f2bc5b','#104c40'],classical:['#a1c9ff','#ffe7aa','#252e58']};
let items=[],pos=0,vel=0,drag=null,raf=0,last=0,chosen=-1,muted=false,ctx;const $=x=>document.getElementById(x),mod=(a,n)=>((a%n)+n)%n;
function sound(){try{ctx ||= new(window.AudioContext||window.webkitAudioContext)();ctx.resume()}catch(e){}}
function tick(){if(muted||!ctx||ctx.state!=='running')return;const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=520;g.gain.setValueAtTime(.045,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.035);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.04)}
function art(v,i){const [a,b,c]=colors[v[5]];const ang=v[0].length*19;return '<div class="art" style="--bright:'+a+';--dark:'+c+'"><svg viewBox="0 0 400 400"><defs><linearGradient id="g'+i+'"><stop stop-color="'+a+'"/><stop offset=".55" stop-color="'+b+'"/><stop offset="1" stop-color="#f5d994"/></linearGradient></defs><g fill="none" stroke="url(#g'+i+')" stroke-width="14" stroke-linejoin="round" transform="rotate('+ang+' 200 200)"><path d="M85 200L160 65 320 120 340 295 175 338Z"/><path d="M100 145Q215 15 310 185T135 330"/><path d="M115 300L280 75 320 315 95 210Z"/></g><circle cx="200" cy="200" r="50" fill="none" stroke="'+a+'" opacity=".5"/></svg><p>'+v[3]+'</p></div>'}
function draw(){const el=$('reel');el.innerHTML='';if(!items.length)return;const size=Math.min(el.clientWidth*.78,390);items.forEach((v,i)=>{let d=mod(i-pos+items.length/2,items.length)-items.length/2;if(Math.abs(d)>2.6)return;const node=document.createElement('div');node.className='tile';node.style.width=size+'px';node.style.marginLeft=-size/2+'px';node.style.transform='translate3d('+(d*size*.7)+'px,0,'+(-Math.abs(d)*180)+'px) rotateY('+(-Math.max(-1,Math.min(1,d))*50)+'deg)';node.style.opacity=Math.max(.12,1-Math.abs(d)*.33);node.style.zIndex=String(10-Math.round(Math.abs(d)*3));node.innerHTML=art(v,i);el.append(node)});const idx=mod(Math.round(pos),items.length);if(idx!==chosen){chosen=idx;const v=items[idx];$('name').textContent=v[0];$('type').textContent=v[3]+' · '+v[1];$('address').textContent=v[2]+', '+v[1];$('gigs').href=v[4];$('map').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(v[0]+' '+v[2]+' '+v[1]+' Victoria')}}
function frame(t){const dt=Math.min(.05,(t-last)/1000||.016);last=t;const old=Math.round(pos);pos+=vel*dt;vel*=Math.exp(-2.1*dt);if(Math.abs(vel)<.14){pos+=(Math.round(pos)-pos)*Math.min(1,dt*14);if(Math.abs(pos-Math.round(pos))<.006){pos=Math.round(pos);vel=0;draw();return}}if(old!==Math.round(pos))tick();draw();raf=requestAnimationFrame(frame)}
function spin(v){sound();cancelAnimationFrame(raf);vel=v;last=0;raf=requestAnimationFrame(frame)}
function search(q){q=q.trim().toLowerCase();const groups={brunswick:['Brunswick','Northcote','Fitzroy','Collingwood'],northcote:['Northcote','Brunswick','Fitzroy'],fitzroy:['Fitzroy','Collingwood','Brunswick'],collingwood:['Collingwood','Fitzroy','Brunswick'],coburg:['Brunswick','Northcote'],carlton:['Brunswick','Fitzroy'],melbourne:['Brunswick','Northcote','Fitzroy','Collingwood']};const key=Object.keys(groups).find(k=>q.includes(k));items=key?all.filter(v=>groups[key].includes(v[1])):all.filter(v=>v[1].toLowerCase().includes(q));pos=0;chosen=-1;cancelAnimationFrame(raf);draw();$('hint').textContent=items.length?items.length+' curated venues near '+q+' · Swipe to explore':'No venues in the current catalogue. Try Brunswick or Fitzroy.';$('gigs').hidden=!items.length;$('map').hidden=!items.length;if(!items.length){$('name').textContent='More venues coming';$('type').textContent='';$('address').textContent=''}}
$('form').onsubmit=e=>{e.preventDefault();search($('place').value)};$('prev').onclick=()=>spin(-2.6);$('next').onclick=()=>spin(2.6);$('sound').onclick=()=>{muted=!muted;sound();$('sound').textContent=muted?'SOUND OFF':'SOUND ON'};
$('reel').onpointerdown=e=>{if(!items.length)return;sound();cancelAnimationFrame(raf);drag={id:e.pointerId,x:e.clientX,t:performance.now(),speed:0};$('reel').setPointerCapture(e.pointerId)};
$('reel').onpointermove=e=>{if(!drag||e.pointerId!==drag.id)return;const t=performance.now(),dx=e.clientX-drag.x,dt=(t-drag.t)/1000,old=Math.round(pos);pos-=dx/(Math.min($('reel').clientWidth*.78,390)*.7);if(dt>.005)drag.speed=-(dx/(Math.min($('reel').clientWidth*.78,390)*.7))/dt;drag.x=e.clientX;drag.t=t;if(old!==Math.round(pos))tick();draw()};
$('reel').onpointerup=e=>{if(!drag)return;const v=drag.speed;drag=null;spin(Math.max(-10,Math.min(10,v)))};$('reel').onpointercancel=()=>{drag=null;spin(0)};$('reel').onkeydown=e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();spin(e.key==='ArrowRight'?2.5:-2.5)}};window.addEventListener('resize',draw);search('Brunswick');
</script></html>
